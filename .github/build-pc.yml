name: build-pc
on:
  workflow_dispatch:
  push:
    paths:
      - 'pc-source.zip'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip source
        shell: pwsh
        run: Expand-Archive -Path pc-source.zip -DestinationPath pc -Force
      - name: Install
        working-directory: pc
        run: npm install
      - name: Build exe
        working-directory: pc
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v0.3.0-${{ github.run_number }}
          name: Cortex PC 0.3.0 (build ${{ github.run_number }})
          files: pc/dist/*.exe
