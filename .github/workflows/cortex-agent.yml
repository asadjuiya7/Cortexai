name: Cortex Developer Agent

# Runs when Cortex (owner's voice) opens an issue labelled "cortex-request".
# Uses FREE AI models only. Opens a pull request; never merges. You review and merge.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  agent:
    if: >
      contains(github.event.issue.labels.*.name, 'cortex-request') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run agent
        run: node .github/cortex-agent/agent.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
